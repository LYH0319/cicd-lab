name: CI Pipeline

on:
  push:

jobs:
  ci:
    name: Typecheck, Format Check and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests and generate report
        run: |
          mkdir -p reports
          npm run test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Vitest Test Results
          path: reports/vitest-junit.xml
          reporter: java-junit
