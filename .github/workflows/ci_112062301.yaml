name: CI Pipeline

on:
  push:

jobs:
  ci:
    name: Typecheck, Format Check and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests and generate report
        run: |
          mkdir -p reports
          npm run test -- --reporter=default --reporter=junit --outputFile.junit=reports/test-report.xml

      - name: List files to verify report
        run: ls -R reports/

      - name: Publish test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/test-report.xml
